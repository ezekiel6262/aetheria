name: Keep Aetheria living
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Advance the world
        env:
          LIVE_URL: ${{ vars.AETHERIA_URL }}
        run: |
          URL="${LIVE_URL:-https://aetheria.vercel.app}"
          curl -fsS --max-time 30 "$URL/api/tick"
          curl -fsS --max-time 20 "$URL/api/health"
